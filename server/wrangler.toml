name = "kronikler-mp"
main = "src/index.ts"
compatibility_date = "2024-09-23"
# Hesap kimliği (gizli değildir) — Account-scoped API token ile /memberships çağrısını
# atlamak ve doğru hesaba deploy etmek için doğrudan burada.
account_id = "9f3fe2d30c25f18f37c267b8f12c3055"

# Durable Objects — her diyar bir RealmDO örneği (otoriteli paylaşımlı durum + WebSocket).
[[durable_objects.bindings]]
name = "REALM"
class_name = "RealmDO"

# DirectoryDO — TEK küresel örnek: açık diyar listesi (kod paylaşmadan tıkla-katıl).
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

# DO sınıflarını taşıyan migration'lar. ÜCRETSİZ planda DO'lar SQLite-tabanlı olmalı.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealmDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DirectoryDO"]

# Ücretsiz katmanda WebSocket hibernation desteklenir; ek ayar gerekmez.
