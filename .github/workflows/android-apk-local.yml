name: APK (yerel derleme - hesapsiz)

# Elle tetiklenir: GitHub -> Actions -> "APK (yerel derleme - hesapsiz)" -> Run workflow.
# EXPO_TOKEN / Expo hesabi GEREKMEZ. Her zaman 'apk' dalini (tum guncellemeler) derler.
# APK indirilebilir artefakt olarak yuklenir (run sayfasi altinda "kronikler-apk").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Gradle assembleDebug (arm64-v8a)
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: APK'yi yukle (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
