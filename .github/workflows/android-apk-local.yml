name: APK (yerel derleme - hesapsiz)

# Elle tetiklenir: GitHub -> Actions -> "APK (yerel derleme - hesapsiz)" -> Run workflow.
# EXPO_TOKEN / Expo hesabi GEREKMEZ. Her zaman 'apk' dalini (tum guncellemeler) derler.
# RELEASE derler (JS gomulu -> telefonda tek basina calisir, splash'ta takilmaz).
# APK'yi 'apk-latest' Release'ine yukler -> dogrudan indirme linki:
#   https://github.com/Tayma67/Kronikler/releases/download/apk-latest/Kronikler.apk
permissions:
  contents: write
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Gradle assembleRelease (arm64-v8a, JS gomulu)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: APK'yi yeniden adlandir
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Kronikler.apk
      - name: Artefakt (yedek indirme)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-apk
          path: Kronikler.apk
      - name: Release'e yukle (dogrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Kronikler - guncel APK
          files: Kronikler.apk
