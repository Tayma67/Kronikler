name: APK (yerel derleme - hesapsiz)

# Elle tetiklenir: GitHub -> Actions -> "APK (yerel derleme - hesapsiz)" -> Run workflow -> dal: apk
# EXPO_TOKEN / Expo hesabi GEREKMEZ. GitHub runner'inda expo prebuild + gradle ile derler,
# APK'yi indirilebilir artefakt olarak yukler (run sayfasi altinda "kronikler-apk").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # apk-latest Release olusturmak/guncellemek icin
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Gradle assembleDebug (arm64-v8a)
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: APK'yi temiz isimle kopyala
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk kronikler.apk
      - name: APK'yi yukle (artefakt)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-apk
          path: kronikler.apk
          if-no-files-found: error
      - name: Release'e yukle (dogrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Kronikler APK (guncel)"
          body: "En guncel derleme. Dogrudan indirme: kronikler.apk (girissiz, herkese acik)."
          files: kronikler.apk
          fail_on_unmatched_files: true
