name: AAB (Play Store - imzali derleme)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    
    steps:
      - name: Checkout APK branch
        uses: actions/checkout@v4
        with:
          ref: apk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Run Expo prebuild
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Update versionCode
        working-directory: mobile/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          grep versionCode build.gradle

      - name: Configure signing
        working-directory: mobile/android/app
        run: |
          cat build.gradle | sed 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' > build.gradle.tmp
          mv build.gradle.tmp build.gradle

      - name: Restore keystore
        working-directory: mobile/android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kronikler.keystore

      - name: Build AAB
        working-directory: mobile/android
        env:
          KRONIKLER_STORE_FILE: app/kronikler.keystore
          KRONIKLER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KRONIKLER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KRONIKLER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Rename AAB
        run: cp mobile/android/app/build/outputs/bundle/release/app-release.aab Kronikler.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-aab
          path: Kronikler.aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-latest
          name: Kronikler - AAB (Play Store)
          files: Kronikler.aab
