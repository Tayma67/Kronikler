name: AAB (Play Store - imzali derleme)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    
    steps:
      - uses: actions/checkout@v4
        with:
          ref: apk

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bagimliliklar (mobile)
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android native uret)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: versionCode'u guncelle
        working-directory: mobile/android/app
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle

      - name: Keystore'u geri yukle
        working-directory: mobile/android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kronikler.keystore

      - name: Gradle bundleRelease (imzali AAB)
        working-directory: mobile/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/kronikler.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon --stacktrace

      - name: AAB'yi yeniden adlandir
        run: cp mobile/android/app/build/outputs/bundle/release/app-release.aab Kronikler.aab

      - name: Artefakt (yedek indirme)
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-aab
          path: Kronikler.aab

      - name: Release'e yukle (dogrudan indirme linki)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-latest
          name: Kronikler - guncel AAB (Play Store)
          files: Kronikler.aab
