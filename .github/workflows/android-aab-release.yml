name: AAB (Play Store - imzali derleme)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
    
    steps:
      - name: Checkout APK branch
        uses: actions/checkout@v4
        with:
          ref: apk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Run Expo prebuild
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Update versionCode
        working-directory: mobile/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle

      - name: Restore keystore
        working-directory: mobile/android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kronikler.keystore

      - name: Build release AAB (signed)
        working-directory: mobile/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/kronikler.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
            --no-daemon \
            --stacktrace

      - name: Rename AAB
        run: |
          mkdir -p release
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab release/Kronikler.aab
          ls -lh release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronikler-aab
          path: release/Kronikler.aab

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-latest
          name: Kronikler - AAB (Play Store)
          files: release/Kronikler.aab
