name: Android Derleme (EAS)

# Elle tetiklenir: GitHub → Actions → "Android Derleme (EAS)" → Run workflow.
# Gizli anahtar gerekir: repo Settings → Secrets → Actions → EXPO_TOKEN
# Not: workflow_dispatch için bu dosyanın varsayılan dalda (main) olması gerekir;
# derleme ref olarak apk dalı seçilerek mobil kod üzerinde çalıştırılır.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = test APK · production = Play AAB"
        type: choice
        default: preview
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Projeyi Expo hesabına bağla (ilk seferde oluşturur)
        working-directory: mobile
        run: eas init --non-interactive --force || true
      - name: EAS build (Android)
        working-directory: mobile
        run: eas build --platform android --profile ${{ github.event.inputs.profile }} --non-interactive --no-wait
